<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Cat Games</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:'DotGothic16',monospace}
.container{border:4px solid #fff;width:100%;height:100%;padding:40px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.site-title{font-size:32px;text-align:center;margin-bottom:20px}
.games-section{margin-top:20px;width:100%;display:flex;flex-direction:column;align-items:center}
.games-title{font-size:20px;margin-bottom:12px;text-align:center}
.games-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.game-card{border:2px solid #fff;padding:6px;text-align:center;text-decoration:none;color:#fff;transition:transform 0.1s;width:150px}
.game-card:hover{transform:scale(1.05)}
.game-card img{width:100%;image-rendering:pixelated}
.game-name{margin-top:6px;font-size:12px}
.pixel-art-container{position:absolute;bottom:0;left:0;display:flex}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<div class="container">
    <div class="site-title">guild cat games</div>
    <div class="games-section">
        <div class="games-title">my roblox games</div>
        <div class="games-grid" id="gamesGrid"></div>
    </div>
    <div class="pixel-art-container" id="pixelArtContainer"></div>
</div>

<script>
/* ===== GAME CARD & LIVE PLAYERS ===== */
const games = [
    { 
        name: "Ice Boat Racing", 
        placeId: "115461364475281",
        thumbnail: "https://tr.rbxcdn.com/180DAY-807e6d7a69e60bc279583b18ed061164/150/150/Image/Webp/noFilter"
    }
];

const gamesGrid = document.getElementById("gamesGrid");

games.forEach(game => {
    const card = document.createElement("a");
    card.className = "game-card";
    card.href = `https://www.roblox.com/games/${game.placeId}/Ice-Boat-Racing`;
    card.target = "_blank";

    const img = document.createElement("img");
    img.src = game.thumbnail;
    img.alt = game.name;
    img.onerror = () => { img.src = "https://via.placeholder.com/150?text=No+Image"; }

    const name = document.createElement("div");
    name.className = "game-name";
    name.textContent = game.name;

    const liveCount = document.createElement("div");
    liveCount.className = "game-name";
    liveCount.style.fontSize = "10px";
    liveCount.style.marginTop = "2px";
    liveCount.textContent = "Players: 0";

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(liveCount);
    gamesGrid.appendChild(card);

    // ===== FETCH LIVE PLAYERS =====
    async function updatePlayers() {
        try {
            const res = await fetch("/live-players");
            const data = await res.json();
            console.log("DEBUG: Live player data:", data);
            const live = data.totalPlayers ?? 0;
            liveCount.textContent = `Players: ${live}`;
        } catch (err) {
            console.error("DEBUG: Failed to fetch live players", err);
            liveCount.textContent = "Players: N/A";
        }
    }

    updatePlayers();
    setInterval(updatePlayers, 15000); // refresh every 15s
});

/* ===== PIXEL ART ===== */
function drawBitmap(data,width,height){
    const canvas=document.createElement('canvas');
    canvas.width=width;
    canvas.height=height;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    const bytesPerRow=Math.ceil(width/8);
    for(let row=0;row<height;row++){
        for(let byteCol=0;byteCol<bytesPerRow;byteCol++){
            const byteIndex=row*bytesPerRow+byteCol;
            if(byteIndex>=data.length) break;
            const byte=data[byteIndex];
            for(let bit=0;bit<8;bit++){
                if(byte & (1<<(7-bit))){
                    const px=byteCol*8+bit;
                    if(px<width) ctx.fillRect(px,row,1,1);
                }
            }
        }
    }
    return canvas;
}
